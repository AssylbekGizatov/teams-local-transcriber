name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: python -m pip install uv==0.8.22
      - run: uv sync --frozen --group dev
      - run: bash scripts/vendor_vexa.sh
      - run: uv run ruff check app tests scripts deploy/vexa
      - run: uv run python -m pytest -q
      - run: node --check app/static/app.js
      - run: npm ci --ignore-scripts
      - run: npm test
