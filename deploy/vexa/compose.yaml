# Experimental browser capture. Read docs/TEAMS_CONNECTOR.md before opting in.
# Run only on a dedicated Docker host/VM: runtime's Docker socket is root-equivalent.
name: teams-asr-vexa
x-db: &db
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: vexa
  DB_USER: vexa
  DB_PASSWORD: ${VEXA_DB_PASSWORD:?Set a unique VEXA_DB_PASSWORD}
x-python-health: &python-health
  interval: 10s
  timeout: 5s
  retries: 10
  start_period: 20s
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: vexa
      POSTGRES_USER: vexa
      POSTGRES_PASSWORD: ${VEXA_DB_PASSWORD:?Set a unique VEXA_DB_PASSWORD}
      TZ: UTC
      PGTZ: UTC
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U vexa -d vexa"]
      interval: 5s
      retries: 10
    networks: [capture]
    restart: unless-stopped
  redis:
    image: valkey/valkey:8.1.3-alpine
    command: [valkey-server, --appendonly, "yes", --appendfsync, everysec]
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 5s
      retries: 10
    networks: [capture]
    restart: unless-stopped
  admin-api:
    build:
      context: ../../vendor/vexa/core/identity/services/admin-api
    environment:
      <<: *db
      ADMIN_API_TOKEN: ${VEXA_ADMIN_TOKEN:?Set a unique VEXA_ADMIN_TOKEN}
      INTERNAL_API_SECRET: ${VEXA_INTERNAL_SECRET:?Set a unique VEXA_INTERNAL_SECRET}
    ports: ["127.0.0.1:18057:8001"]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      <<: *python-health
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
    networks: [capture]
    init: true
    restart: unless-stopped
  runtime:
    build:
      context: ../../vendor/vexa/core/runtime
    environment:
      BROWSER_IMAGE: teams-asr-vexa-bot:f1a62fbb-local1
      DOCKER_NETWORK: teams-asr-vexa
      REDIS_URL: redis://redis:6379/0
      INTERNAL_API_SECRET: ${VEXA_INTERNAL_SECRET:?Set a unique VEXA_INTERNAL_SECRET}
      # No agent services, LLM endpoints, external credentials or session mounts.
    volumes: [/var/run/docker.sock:/var/run/docker.sock]
    depends_on:
      redis: {condition: service_healthy}
    healthcheck:
      <<: *python-health
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
    networks: [capture]
    init: true
    restart: unless-stopped
  meeting-api:
    build:
      context: ../../vendor/vexa
      dockerfile: core/meetings/services/meeting-api/Dockerfile
    environment:
      <<: *db
      REDIS_URL: redis://redis:6379/0
      RUNTIME_API_URL: http://runtime:8090
      ADMIN_API_URL: http://admin-api:8001
      MEETING_API_URL: http://meeting-api:8080
      ADMIN_TOKEN: ${VEXA_ADMIN_TOKEN:?Set a unique VEXA_ADMIN_TOKEN}
      INTERNAL_API_SECRET: ${VEXA_INTERNAL_SECRET:?Set a unique VEXA_INTERNAL_SECRET}
      TRANSCRIPTION_SERVICE_URL: http://asr-app:8000
      TRANSCRIPTION_SERVICE_TOKEN: ${ASR_API_TOKEN:?Set the SAME ASR_API_TOKEN as the local app}
      TRANSCRIPTION_MODEL: local
      TRANSCRIBE_ENABLED: "true"
      RECORDING_ENABLED: "false"
      BOT_AUTHENTICATED: "false"
      DEFAULT_BOT_NAME: Local transcription bot
      # Raw storage is deliberately absent; source patch also strips upload URL.
      MINIO_ENDPOINT: 127.0.0.1:1
      MINIO_ACCESS_KEY: disabled
      MINIO_SECRET_KEY: disabled
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      admin-api: {condition: service_healthy}
      runtime: {condition: service_healthy}
    healthcheck:
      <<: *python-health
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
    networks: [capture]
    init: true
    restart: unless-stopped
  vexa-gateway:
    build:
      context: ../../vendor/vexa
      dockerfile: core/gateway/services/gateway/Dockerfile
    environment:
      ADMIN_API_URL: http://admin-api:8001
      MEETING_API_URL: http://meeting-api:8080
      AGENT_API_URL: ""
      MCP_URL: ""
      REDIS_URL: redis://redis:6379/0
      INTERNAL_API_SECRET: ${VEXA_INTERNAL_SECRET:?Set a unique VEXA_INTERNAL_SECRET}
    ports: ["127.0.0.1:18056:8000"]
    depends_on:
      admin-api: {condition: service_healthy}
      meeting-api: {condition: service_healthy}
    healthcheck:
      <<: *python-health
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
    networks: [capture]
    init: true
    restart: unless-stopped
  bot-image:
    profiles: [build-only]
    build:
      context: ../../vendor/vexa
      dockerfile: .local-build/Dockerfile.bot
    image: teams-asr-vexa-bot:f1a62fbb-local1
    entrypoint: ["true"]
    networks: [capture]
networks:
  capture:
    name: teams-asr-vexa
volumes:
  postgres-data:
  redis-data:
